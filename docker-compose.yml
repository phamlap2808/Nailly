services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nailly
      POSTGRES_PASSWORD: nailly
      POSTGRES_DB: nailly
    ports:
      - "5434:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nailly -d nailly"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: nailly
      MINIO_ROOT_PASSWORD: nailly-password
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 nailly nailly-password; do sleep 2; done;
      mc mb -p local/nailly-media || true;
      mc anonymous set download local/nailly-media;
      "

  tooling:
    image: oven/bun:1.2.15
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
      - bun-cache:/root/.bun/install/cache
    command: sh -lc "bun --version"

  api:
    image: oven/bun:1.2.15
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
      - bun-cache:/root/.bun/install/cache
    ports:
      - "8787:8787"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    command: sh -lc "bun --filter @nailly/api dev"

  web:
    image: oven/bun:1.2.15
    working_dir: /workspace
    env_file:
      - .env
    volumes:
      - .:/workspace
      - bun-cache:/root/.bun/install/cache
    ports:
      - "3000:3000"
    depends_on:
      - api
    command: sh -lc "bun --filter @nailly/web dev -- --host 0.0.0.0 --port 3000"

volumes:
  postgres-data:
  minio-data:
  bun-cache:
